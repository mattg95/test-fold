<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Fold</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>Test Fold</h1>
  <label class="toggle"><span>Enable test folding</span><input id="enabled" type="checkbox" role="switch"></label>
  <div class="actions">
    <button id="fold-toggle" title="Expand or collapse all detected tests and hooks" disabled>Expand tests</button>
  </div>
  <p id="status" role="status">Checking this tab…</p>
</body>
</html>
